---
name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE] "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the form below.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of feature is this?
      options:
        - New Sprint Module (Java topic)
        - New Code Example / Exercise
        - Documentation Improvement
        - CI/CD Enhancement
        - Build/Tooling Improvement
        - Quality Tool Configuration
        - Test Coverage
        - Accessibility / UX
        - Other
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Target Sprint
      description: Which sprint does this relate to?
      options:
        - Sprint 1: Java Fundamentals
        - Sprint 2: Object Oriented Programming
        - Sprint 3: Collections & Generics
        - Sprint 4: Java 8+ Functional Programming
        - Sprint 5: Multithreading & Concurrency
        - Sprint 6: JVM Internals
        - Sprint 7: Design Patterns
        - Sprint 8: Spring Framework
        - Sprint 9: Spring Boot
        - Sprint 10: Spring Security
        - Sprint 11: Microservices
        - Sprint 12: Cloud & DevOps
        - Cross-cutting / Infrastructure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the pain point?
      placeholder: "Currently, learners struggle with..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: "I propose adding..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is this the best?

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Any thoughts on how to implement this? (Optional)
      placeholder: |
        - Add new file at `java-fundamentals/src/main/java/...`
        - Update documentation at `docs/...`
        - Add test cases

  - type: textarea
    id: examples
    attributes:
      label: Real-world Examples / References
      description: Links to similar implementations, tutorials, or resources

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This aligns with the Java Engineering Academy learning path
          required: true
        - label: I'm willing to implement this feature
          required: false
        - label: I've checked for duplicate feature requests
          required: true
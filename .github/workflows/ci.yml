name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Content Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "Root README.md missing"
            exit 1
          fi

      - name: Check module structure
        run: |
          echo "Checking module structure..."
          for dir in 00-fundamentals 01-programming-languages 02-computer-science 03-software-design 04-backend-engineering 05-data-platforms 06-data-engineering 07-messaging 08-integration-engineering 09-observability 10-security 11-architecture 12-testing 13-devops 14-cloud 15-big-data 16-machine-learning 17-engineering-excellence 18-reference-implementations 19-case-studies 20-interview-preparation 21-learning-paths 22-career-roadmap 23-open-source 24-certifications; do
            if [ -d "$dir" ]; then
              echo "OK: $dir"
            else
              echo "MISSING: $dir"
            fi
          done

      - name: Count content
        run: |
          echo "=== Repository Stats ==="
          echo "README files: $(find . -name 'README.md' -not -path '*/.git/*' | wc -l)"
          echo "Java files: $(find . -name '*.java' -not -path '*/.git/*' | wc -l)"
          echo "Total files: $(find . -type f -not -path '*/.git/*' | wc -l)"

# =============================================
# Spring Boot Application Configuration
# =============================================

# Application Name
spring.application.name=spring-boot-demo

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Profile Configuration
spring.profiles.active=dev

# Logging Configuration
logging.level.root=INFO
logging.level.academy.javaengineering.springboot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Custom Application Properties
app.name=Spring Boot Demo
app.description=Demonstrates Spring Boot features
app.version=1.0.0
app.author=Java Engineering Academy

# Feature Toggles
app.features.logging.enabled=true
app.features.metrics.enabled=true
app.features.cache.enabled=false

# Database Configuration (example)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

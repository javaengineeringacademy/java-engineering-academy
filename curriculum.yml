# Java Engineering Academy - Curriculum Manifest
# Single source of truth for structure, navigation, and learning paths
# Can be used to generate READMEs, breadcrumbs, navigation, and progress tracking

meta:
  name: Java Engineering Academy
  version: "1.0.0"
  description: "Complete Java curriculum from Student to CTO"
  author: javaengineeringacademy
  repository: https://github.com/javaengineeringacademy/java-engineering-academy

# ============================================================
# MODULE DEFINITIONS
# ============================================================

modules:

  # ==========================================================
  # 00-FUNDAMENTALS (Cross-cutting concerns)
  # ==========================================================
  - id: fundamentals
    title: Software Engineering Fundamentals
    path: 00-fundamentals
    level: beginner
    time_estimate: "10-15 hours"
    prerequisites: []
    tags: [fundamentals, cross-cutting]

    topics:
      - id: engineering-principles
        title: Engineering Principles
        path: engineering-principles
        time: "2-3 hours"
        prerequisites: []
        description: "Core principles every software engineer must know"

      - id: trade-offs
        title: Trade-offs & Decisions
        path: trade-offs
        time: "2-3 hours"
        prerequisites: [engineering-principles]
        description: "How to make architectural decisions"

      - id: economics
        title: Engineering Economics
        path: economics
        time: "1-2 hours"
        prerequisites: []
        description: "Cost-benefit analysis for technical decisions"

      - id: glossary
        title: Technical Glossary
        path: glossary
        time: "1 hour"
        prerequisites: []
        description: "Common terms and definitions"

      - id: metrics
        title: Engineering Metrics
        path: metrics
        time: "2-3 hours"
        prerequisites: []
        description: "DORA metrics, code quality metrics, performance metrics"

      - id: reliability
        title: Reliability Engineering
        path: reliability
        time: "2-3 hours"
        prerequisites: [metrics]
        description: "SLAs, SLOs, error budgets"

      - id: maintenance
        title: Software Maintenance
        path: maintenance
        time: "1-2 hours"
        prerequisites: []
        description: "Legacy code, technical debt, refactoring"

      - id: decision-making
        title: Decision Frameworks
        path: decision-making
        time: "2-3 hours"
        prerequisites: [trade-offs]
        description: "Structured approaches to technical decisions"

  # ==========================================================
  # 01-PROGRAMMING LANGUAGES
  # ==========================================================
  - id: programming-languages
    title: Programming Languages
    path: 01-programming-languages
    level: beginner
    time_estimate: "200+ hours"
    prerequisites: [fundamentals]
    tags: [programming, languages]

    languages:
      # --------------------------------------------------------
      # JAVA (Primary focus)
      # --------------------------------------------------------
      - id: java
        title: Java
        path: Java
        level: beginner-to-architect
        time_estimate: "150+ hours"
        prerequisites: []
        description: "Complete Java curriculum from basics to enterprise"
        tags: [java, primary]

        modules:
          # Knowledge Atoms
          - id: knowledge-atoms
            title: Knowledge Atoms
            path: 00-knowledge-atoms
            level: intermediate
            time_estimate: "10-15 hours"
            prerequisites: [java.01-fundamentals, java.02-oop]
            description: "Shared concepts that appear across multiple topics"
            topics:
              - id: java-memory-model
                title: Java Memory Model
                path: java-memory-model
                time: "3-4 hours"
                prerequisites: [java.09-multithreading]
                next: [java.10-jvm-internals.garbage-collection]

              - id: garbage-collection
                title: Garbage Collection
                path: garbage-collection
                time: "3-4 hours"
                prerequisites: [java.01-fundamentals.variables]
                next: [java.10-jvm-internals]

              - id: equals-hashcode
                title: equals() and hashCode()
                path: equals-hashcode
                time: "2-3 hours"
                prerequisites: [java.02-oop]
                next: [java.04-collections]

              - id: immutability
                title: Immutability
                path: immutability
                time: "1-2 hours"
                prerequisites: [java.02-oop]
                next: [java.06-generics.records]

              - id: pass-by-value
                title: Pass-by-Value
                path: pass-by-value
                time: "1 hour"
                prerequisites: [java.01-fundamentals]
                next: [java.02-oop]

              - id: autoboxing
                title: Autoboxing
                path: autoboxing
                time: "1 hour"
                prerequisites: [java.01-fundamentals]
                next: [java.04-collections]

              - id: type-safety
                title: Type Safety
                path: type-safety
                time: "1-2 hours"
                prerequisites: [java.06-generics]
                next: [java.07-functional-programming]

          # Fundamentals
          - id: 01-fundamentals
            title: Java Fundamentals
            path: 01-fundamentals
            level: beginner
            time_estimate: "20-25 hours"
            prerequisites: []
            next: [java.02-oop]
            topics:
              - id: variables
                title: Variables & Types
                path: 01-variables
                time: "2-3 hours"
                prerequisites: []
              - id: operators
                title: Operators
                path: 02-operators
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals.variables]
              - id: control-flow
                title: Control Flow
                path: 03-control-flow
                time: "3-4 hours"
                prerequisites: [java.01-fundamentals.operators]
              - id: methods
                title: Methods
                path: 04-methods
                time: "3-4 hours"
                prerequisites: [java.01-fundamentals.control-flow]
              - id: arrays
                title: Arrays
                path: 05-arrays
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals.methods]
              - id: strings
                title: Strings
                path: 06-strings
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals.arrays]
              - id: wrapper-classes
                title: Wrapper Classes
                path: 07-wrapper-classes
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals.variables]
                next: [java.knowledge-atoms.autoboxing, java.04-collections]
              - id: project-structure
                title: Project Structure
                path: 08-project-structure
                time: "2-3 hours"
                prerequisites: []
              - id: maven
                title: Maven
                path: 09-maven
                time: "3-4 hours"
                prerequisites: [java.01-fundamentals.project-structure]
              - id: keywords
                title: Java Keywords
                path: 10-keywords
                time: "2-3 hours"
                prerequisites: []

          # OOP
          - id: 02-oop
            title: Object-Oriented Programming
            path: 02-oop
            level: beginner-to-intermediate
            time_estimate: "30-40 hours"
            prerequisites: [java.01-fundamentals]
            next: [java.03-exception-handling]
            topics:
              - id: introduction
                title: Introduction to OOP
                path: 01-introduction
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals]
              - id: classes
                title: Classes
                path: 02-classes
                time: "3-4 hours"
                prerequisites: [java.02-oop.introduction]
              - id: objects
                title: Objects
                path: 03-objects
                time: "3-4 hours"
                prerequisites: [java.02-oop.classes]
              - id: constructors
                title: Constructors
                path: 04-constructors
                time: "2-3 hours"
                prerequisites: [java.02-oop.objects]
              - id: methods-oop
                title: Methods
                path: 05-methods
                time: "3-4 hours"
                prerequisites: [java.02-oop.constructors]
              - id: this-keyword
                title: this Keyword
                path: 06-this-keyword
                time: "1-2 hours"
                prerequisites: [java.02-oop.methods-oop]
              - id: super-keyword
                title: super Keyword
                path: 07-super-keyword
                time: "1-2 hours"
                prerequisites: [java.02-oop.this-keyword]
              - id: encapsulation
                title: Encapsulation
                path: 08-encapsulation
                time: "3-4 hours"
                prerequisites: [java.02-oop.super-keyword]
              - id: inheritance
                title: Inheritance
                path: 09-inheritance
                time: "4-5 hours"
                prerequisites: [java.02-oop.encapsulation]
              - id: polymorphism
                title: Polymorphism
                path: 10-polymorphism
                time: "4-5 hours"
                prerequisites: [java.02-oop.inheritance]
              - id: abstraction
                title: Abstraction
                path: 11-abstraction
                time: "3-4 hours"
                prerequisites: [java.02-oop.polymorphism]
              - id: interfaces
                title: Interfaces
                path: 12-interfaces
                time: "3-4 hours"
                prerequisites: [java.02-oop.abstraction]
              - id: abstract-classes
                title: Abstract Classes
                path: 13-abstract-classes
                time: "2-3 hours"
                prerequisites: [java.02-oop.interfaces]
              - id: composition
                title: Composition
                path: 14-composition
                time: "3-4 hours"
                prerequisites: [java.02-oop.abstract-classes]
              - id: aggregation
                title: Aggregation
                path: 15-aggregation
                time: "2-3 hours"
                prerequisites: [java.02-oop.composition]
              - id: association
                title: Association
                path: 16-association
                time: "2-3 hours"
                prerequisites: [java.02-oop.aggregation]
              - id: coupling
                title: Coupling
                path: 17-coupling
                time: "2-3 hours"
                prerequisites: [java.02-oop.association]
              - id: cohesion
                title: Cohesion
                path: 18-cohesion
                time: "2-3 hours"
                prerequisites: [java.02-oop.coupling]
              - id: solid-principles
                title: SOLID Principles
                path: 19-solid-principles
                time: "4-5 hours"
                prerequisites: [java.02-oop.cohesion]
              - id: oop-design-principles
                title: OOP Design Principles
                path: 20-oop-design-principles
                time: "3-4 hours"
                prerequisites: [java.02-oop.solid-principles]
              - id: class-diagrams
                title: Class Diagrams
                path: 21-class-diagrams
                time: "2-3 hours"
                prerequisites: [java.02-oop.oop-design-principles]
              - id: object-lifecycle
                title: Object Lifecycle
                path: 22-object-lifecycle
                time: "2-3 hours"
                prerequisites: [java.02-oop.constructors]
              - id: tight-loose-coupling
                title: Tight vs Loose Coupling
                path: 23-tight-loose-coupling
                time: "2-3 hours"
                prerequisites: [java.02-oop.coupling]
              - id: inner-classes
                title: Inner Classes
                path: 24-inner-classes
                time: "2-3 hours"
                prerequisites: [java.02-oop.classes]
              - id: sealed-classes
                title: Sealed Classes
                path: 25-sealed-classes
                time: "2-3 hours"
                prerequisites: [java.02-oop.interfaces]
              - id: enums
                title: Enums
                path: 26-enums
                time: "3-4 hours"
                prerequisites: [java.02-oop.classes]
              - id: pattern-matching
                title: Pattern Matching
                path: 27-pattern-matching
                time: "2-3 hours"
                prerequisites: [java.02-oop.sealed-classes]
              - id: nested-classes
                title: Nested Classes
                path: 28-nested-classes
                time: "2-3 hours"
                prerequisites: [java.02-oop.inner-classes]
              - id: varargs
                title: Varargs
                path: 29-varargs
                time: "1-2 hours"
                prerequisites: [java.02-oop.methods-oop]
              - id: packages
                title: Packages
                path: 30-packages
                time: "2-3 hours"
                prerequisites: [java.02-oop.classes]
              - id: java-object
                title: Java Object Methods
                path: 31-java-object
                time: "2-3 hours"
                prerequisites: [java.02-oop.objects]
              - id: comparable-comparator
                title: Comparable & Comparator
                path: 32-comparable-comparator
                time: "2-3 hours"
                prerequisites: [java.02-oop.interfaces]
              - id: records
                title: Records
                path: 33-records
                time: "2-3 hours"
                prerequisites: [java.02-oop.classes]
              - id: string-immutable
                title: String Immutability
                path: 34-string-immutable
                time: "1-2 hours"
                prerequisites: [java.01-fundamentals.strings]
              - id: wrapper-classes-oop
                title: Wrapper Classes
                path: 35-wrapper-classes
                time: "2-3 hours"
                prerequisites: [java.01-fundamentals.wrapper-classes]
              - id: access-modifiers
                title: Access Modifiers
                path: 36-access-modifiers
                time: "2-3 hours"
                prerequisites: [java.02-oop.encapsulation]

          # Exception Handling
          - id: 03-exception-handling
            title: Exception Handling
            path: 03-exception-handling
            level: intermediate
            time_estimate: "10-15 hours"
            prerequisites: [java.02-oop]
            next: [java.04-collections]

          # Collections
          - id: 04-collections
            title: Collections Framework
            path: 04-collections
            level: intermediate
            time_estimate: "25-30 hours"
            prerequisites: [java.02-oop, java.knowledge-atoms.equals-hashcode]
            next: [java.05-text-processing]
            sub-modules:
              - id: 01-overview
                title: Collections Overview
                path: 01-overview
                time: "2-3 hours"
                prerequisites: [java.02-oop]
                next: [java.04-collections.02-list]

              - id: 02-list
                title: List Interface
                path: 02-list
                time: "5-6 hours"
                prerequisites: [java.04-collections.01-overview]
                next: [java.04-collections.03-iterators]
                topics:
                  - id: arraylist
                    title: ArrayList
                    path: arraylist
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.02-list]
                    next: [java.04-collections.02-list.linkedlist]
                  - id: linkedlist
                    title: LinkedList
                    path: linkedlist
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.02-list.arraylist]
                    next: [java.04-collections.02-list.vector]
                  - id: vector
                    title: Vector
                    path: vector
                    time: "1-2 hours"
                    prerequisites: [java.04-collections.02-list.linkedlist]
                    next: [java.04-collections.02-list.stack]
                  - id: stack
                    title: Stack
                    path: stack
                    time: "1-2 hours"
                    prerequisites: [java.04-collections.02-list.vector]
                    next: [java.04-collections.03-iterators]

              - id: 03-iterators
                title: Iterators
                path: 03-iterators
                time: "2-3 hours"
                prerequisites: [java.04-collections.02-list]
                next: [java.04-collections.04-comparators]

              - id: 04-comparators
                title: Comparators
                path: 04-comparators
                time: "2-3 hours"
                prerequisites: [java.04-collections.03-iterators]
                next: [java.04-collections.05-sorting]

              - id: 05-sorting
                title: Sorting Algorithms
                path: 05-sorting
                time: "3-4 hours"
                prerequisites: [java.04-collections.04-comparators]
                next: [java.04-collections.06-searching]

              - id: 06-searching
                title: Searching Algorithms
                path: 06-searching
                time: "2-3 hours"
                prerequisites: [java.04-collections.05-sorting]
                next: [java.04-collections.07-queue]

              - id: 07-queue
                title: Queue Interface
                path: 07-queue
                time: "4-5 hours"
                prerequisites: [java.04-collections.06-searching]
                next: [java.04-collections.08-deque]
                topics:
                  - id: priority
                    title: PriorityQueue
                    path: priority
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.07-queue]
                    next: [java.04-collections.08-deque]
                  - id: deque
                    title: Deque
                    path: deque
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.07-queue.priority]
                    next: [java.04-collections.09-blocking-queue]

              - id: 08-deque
                title: Deque Interface
                path: 08-deque
                time: "2-3 hours"
                prerequisites: [java.04-collections.07-queue]
                next: [java.04-collections.09-blocking-queue]

              - id: 09-blocking-queue
                title: Blocking Queue
                path: 09-blocking-queue
                time: "2-3 hours"
                prerequisites: [java.04-collections.08-deque]
                next: [java.04-collections.10-set]

              - id: 10-set
                title: Set Interface
                path: 10-set
                time: "4-5 hours"
                prerequisites: [java.04-collections.09-blocking-queue]
                next: [java.04-collections.11-sorted-set]
                topics:
                  - id: hashset
                    title: HashSet
                    path: hashset
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.10-set]
                    next: [java.04-collections.10-set.linkedhashset]
                  - id: linkedhashset
                    title: LinkedHashSet
                    path: linkedhashset
                    time: "1-2 hours"
                    prerequisites: [java.04-collections.10-set.hashset]
                    next: [java.04-collections.10-set.treeset]
                  - id: treeset
                    title: TreeSet
                    path: treeset
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.10-set.linkedhashset]
                    next: [java.04-collections.11-sorted-set]

              - id: 11-sorted-set
                title: SortedSet Interface
                path: 11-sorted-set
                time: "2-3 hours"
                prerequisites: [java.04-collections.10-set]
                next: [java.04-collections.12-navigable-set]

              - id: 12-navigable-set
                title: NavigableSet Interface
                path: 12-navigable-set
                time: "2-3 hours"
                prerequisites: [java.04-collections.11-sorted-set]
                next: [java.04-collections.13-collection-utils]

              - id: 13-collection-utils
                title: Collections Utility Class
                path: 13-collection-utils
                time: "2-3 hours"
                prerequisites: [java.04-collections.12-navigable-set]
                next: [java.04-collections.14-map]

              - id: 14-map
                title: Map Interface
                path: 14-map
                time: "5-6 hours"
                prerequisites: [java.04-collections.13-collection-utils]
                next: [java.04-collections.15-sorted-map]
                topics:
                  - id: hashmap
                    title: HashMap
                    path: hashmap
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.14-map]
                    next: [java.04-collections.14-map.linkedhashmap]
                  - id: linkedhashmap
                    title: LinkedHashMap
                    path: linkedhashmap
                    time: "1-2 hours"
                    prerequisites: [java.04-collections.14-map.hashmap]
                    next: [java.04-collections.14-map.treemap]
                  - id: treemap
                    title: TreeMap
                    path: treemap
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.14-map.linkedhashmap]
                    next: [java.04-collections.14-map.concurrenthashmap]
                  - id: concurrenthashmap
                    title: ConcurrentHashMap
                    path: concurrenthashmap
                    time: "2-3 hours"
                    prerequisites: [java.04-collections.14-map.treemap]
                    next: [java.04-collections.15-sorted-map]

              - id: 15-sorted-map
                title: SortedMap Interface
                path: 15-sorted-map
                time: "2-3 hours"
                prerequisites: [java.04-collections.14-map]
                next: [java.04-collections.16-navigable-map]

              - id: 16-navigable-map
                title: NavigableMap Interface
                path: 16-navigable-map
                time: "2-3 hours"
                prerequisites: [java.04-collections.15-sorted-map]
                next: [java.04-collections.17-map-utils]

              - id: 17-map-utils
                title: Map Utility Methods
                path: 17-map-utils
                time: "1-2 hours"
                prerequisites: [java.04-collections.16-navigable-map]
                next: [java.04-collections.18-enum-map]

              - id: 18-enum-map
                title: EnumMap
                path: 18-enum-map
                time: "1-2 hours"
                prerequisites: [java.04-collections.17-map-utils]
                next: [java.04-collections.19-weak-reference]

              - id: 19-weak-reference
                title: Weak References & IdentityHashMap
                path: 19-weak-reference
                time: "2-3 hours"
                prerequisites: [java.04-collections.18-enum-map]
                next: [java.04-collections.20-copy-on-write]

              - id: 20-copy-on-write
                title: Copy-on-Write Collections
                path: 20-copy-on-write
                time: "1-2 hours"
                prerequisites: [java.04-collections.19-weak-reference]
                next: [java.04-collections.21-synchronized]

              - id: 21-synchronized
                title: Synchronized Collections
                path: 21-synchronized
                time: "2-3 hours"
                prerequisites: [java.04-collections.20-copy-on-write]
                next: [java.04-collections.22-properties]

              - id: 22-properties
                title: Properties Class
                path: 22-properties
                time: "1-2 hours"
                prerequisites: [java.04-collections.21-synchronized]
                next: [java.04-collections.23-hashtable]

              - id: 23-hashtable
                title: Hashtable
                path: 23-hashtable
                time: "2-3 hours"
                prerequisites: [java.04-collections.14-map.hashmap]
                next: [java.04-collections.24-best-practices]

              - id: 24-best-practices
                title: Collections Best Practices
                path: 24-best-practices
                time: "2-3 hours"
                prerequisites: [java.04-collections.23-hashtable]
                next: [java.05-text-processing]

          # Text Processing
          - id: 05-text-processing
            title: Text Processing
            path: 05-text-processing
            level: intermediate
            time_estimate: "15-20 hours"
            prerequisites: [java.04-collections]
            next: [java.06-generics]

          # Generics
          - id: 06-generics
            title: Generics
            path: 06-generics
            level: intermediate
            time_estimate: "15-20 hours"
            prerequisites: [java.04-collections]
            next: [java.07-functional-programming]

          # Functional Programming
          - id: 07-functional-programming
            title: Functional Programming
            path: 07-functional-programming
            level: intermediate-to-advanced
            time_estimate: "20-25 hours"
            prerequisites: [java.06-generics]
            next: [java.08-io-nio]

          # I/O & NIO
          - id: 08-io-nio
            title: I/O & NIO
            path: 08-io-nio
            level: intermediate
            time_estimate: "15-20 hours"
            prerequisites: [java.04-collections]
            next: [java.09-multithreading]

          # Multithreading
          - id: 09-multithreading
            title: Multithreading
            path: 09-multithreading
            level: advanced
            time_estimate: "25-30 hours"
            prerequisites: [java.02-oop]
            next: [java.10-jvm-internals]
            topics:
              - id: threads-basics
                title: Thread Basics
                path: 01-threads-basics
                time: "3-4 hours"
                prerequisites: [java.02-oop]
              - id: runnable-callable
                title: Runnable & Callable
                path: 02-runnable-callable
                time: "2-3 hours"
                prerequisites: [java.09-multithreading.threads-basics]
              - id: synchronization
                title: Synchronization
                path: 03-synchronization
                time: "4-5 hours"
                prerequisites: [java.09-multithreading.runnable-callable]
              - id: locks
                title: Locks & Conditions
                path: 04-locks
                time: "3-4 hours"
                prerequisites: [java.09-multithreading.synchronization]
              - id: executor-framework
                title: Executor Framework
                path: 05-executor-framework
                time: "3-4 hours"
                prerequisites: [java.09-multithreading.locks]
              - id: concurrent-collections
                title: Concurrent Collections
                path: 06-concurrent-collections
                time: "3-4 hours"
                prerequisites: [java.09-multithreading.executor-framework]
              - id: atomic-variables
                title: Atomic Variables
                path: 07-atomic-variables
                time: "2-3 hours"
                prerequisites: [java.09-multithreading.concurrent-collections]
              - id: virtual-threads
                title: Virtual Threads
                path: 08-virtual-threads
                time: "3-4 hours"
                prerequisites: [java.09-multithreading.executor-framework]
                next: [java.09-multithreading.completable-future]
              - id: completable-future
